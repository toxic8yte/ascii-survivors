name: Test and deploy game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Generate catalogues from JSON
        run: |
          node --check audit-weapons.cjs
          node build-content.cjs
          node build-enemies.cjs
      - name: Check JavaScript syntax
        run: |
          for file in enemy-roster.js enemy-system.js build-enemies.cjs build-content.cjs content-data.js catalog.js combat.js core.js progress.js renderer.js game.js verify.cjs verify-progress.cjs verify-enemies.cjs verify-arena.cjs verify-content.cjs verify-evolution.cjs verify-progression.cjs verify-director.cjs verify-heroes.cjs verify-combat.cjs verify-data.cjs verify-balance.cjs verify-scifi.cjs verify-sheet-edits.cjs benchmark.cjs; do
            node --check "$file"
          done
      - name: Test gameplay and rendering
        run: |
          node build-enemies.cjs --check
          node build-content.cjs --check
          node verify-data.cjs
          node verify-balance.cjs
          node verify-scifi.cjs
          node verify-sheet-edits.cjs
          node --check verify-upgrades.cjs
          node verify-upgrades.cjs
          node --check verify-sandbox.cjs
          node verify-sandbox.cjs
          node verify-director.cjs
          node verify-combat.cjs
          node verify-heroes.cjs
          node verify.cjs
          node verify-enemies.cjs
          node verify-progress.cjs
          node verify-arena.cjs
          node verify-content.cjs
          node verify-evolution.cjs
          node verify-progression.cjs
      - name: Package game files
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp index.html style.css enemy-roster.js content-data.js enemy-system.js catalog.js combat.js core.js progress.js renderer.js game.js _site/
          node <<'NODE'
          const fs = require('node:fs');
          const path = '_site/index.html';
          let html = fs.readFileSync(path, 'utf8');
          for (const file of ['style.css', 'enemy-roster.js', 'content-data.js', 'enemy-system.js', 'catalog.js', 'combat.js', 'core.js', 'progress.js', 'renderer.js', 'game.js']) {
            html = html.replaceAll(`"${file}"`, `"${file}?v=${process.env.GITHUB_SHA}"`);
          }
          fs.writeFileSync(path, html);
          NODE
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
